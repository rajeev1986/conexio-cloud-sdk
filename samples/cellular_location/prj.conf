# =============================================================================
# Cellular Location — AT%NCELLMEAS cell-based positioning
# =============================================================================
CONFIG_CONEXIO_CLOUD=y

# CBOR binary encoding
CONFIG_CONEXIO_CLOUD_CBOR=y
CONFIG_CONEXIO_CLOUD_CBOR_BUFFER_SIZE=512

# Retry
CONFIG_CONEXIO_CLOUD_RETRY=y

# Cellular location — enables AT%NCELLMEAS module
CONFIG_CELL_LOCATION=y

# How often to trigger a cell measurement (independent of telemetry interval)
# 3600 = 1 fix per hour; use 28800 (8h) for production
CONFIG_CELL_LOCATION_INTERVAL_SEC=60

# Search type: 0=fast/coarse, 1=moderate (default), 2=thorough/most accurate
# CONFIG_CELL_LOCATION_SEARCH_TYPE=1

# Publish telemetry immediately after a location fix
CONFIG_CELL_LOCATION_PUBLISH_ON_FIX=y

# C library / system
CONFIG_POSIX_THREADS=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_RESET_ON_FATAL_ERROR=y

# TF-M minimal profile (required for bootloader partition layout)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

CONFIG_CONEXIO_CLOUD_INGEST_ENDPOINT="d04820601bybhat5l4fpv-ats.iot.us-east-1.amazonaws.com"
CONFIG_CONEXIO_CLOUD_INGEST_KEY="cnx_8498d4f8_ec19e2ba44ad018423fb6fbf77931c16"