# ── Development environment overlay ──────────────────────────────────────────
# Apply on top of prj.conf for dev builds:
#   west build -b conexio_stratus_pro/nrf9151/ns --pristine \
#              -- -DEXTRA_CONF_FILE=prj_dev.conf
#
# Connects to the same MQTT endpoint (mqtt.cloud.conexiotech.com) but uses
# the dev fleet provisioning template → devices get the -dev IoT policy and
# auto-register into iot-dashboard-devices-dev (not the prod table).
CONFIG_STRATUS_FLEET_TEMPLATE="ConexioFleetTemplate-dev"
