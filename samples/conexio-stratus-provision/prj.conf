# =============================================================================
# conexio-stratus-provision — AWS Fleet Provisioning for nRF9151/nRF9160
# NCS v3.2.1
# =============================================================================

# ── AWS endpoint ──────────────────────────────────────────────────────────────
CONFIG_STRATUS_AWS_ENDPOINT="a2t1ogibbsuad8-ats.iot.us-east-1.amazonaws.com"
CONFIG_STRATUS_FLEET_TEMPLATE="ConexioFleetTemplate"

# ── Modem ─────────────────────────────────────────────────────────────────────
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_MODEM_INFO=y

# ── Networking — offloaded stack (nRF91xx modem handles IP+TLS) ───────────────
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# ── MQTT ──────────────────────────────────────────────────────────────────────
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_KEEPALIVE=60

# ── TLS credential management ─────────────────────────────────────────────────
CONFIG_MODEM_KEY_MGMT=y
CONFIG_TLS_CREDENTIALS=y

# ── C library ─────────────────────────────────────────────────────────────────
# Do NOT set CONFIG_POSIX_API — on NCS v3.2.1 it pulls in POSIX_NETWORKING
# which selects NRF_MODEM_LIB_NET_IF and NET_CONNECTION_MANAGER. Those two
# conflict with our direct lte_lc_connect_async() usage and cause the modem
# socket create to crash when called outside of conn_mgr context.
# All socket calls already use zsock_ prefixes, which is correct without POSIX_API.
#
# POSIX_DEVICE_IO must be set to pre-populate fdtable[0/1/2] with stdin/stdout/stderr.
# Without it ZVFS_OPEN_MAX defaults to 4 and all entries start free, so the first
# zsock_socket() call returns fd=0 (stdin slot). The MQTT library then calls
# zsock_setsockopt(0, SOL_TLS, ...) which hits the stdinout vtable with no TLS
# ioctl handler → null function pointer dereference → BusFault.
CONFIG_POSIX_DEVICE_IO=y
# ZVFS_OPEN_MAX defaults to 4. With stdin/stdout/stderr taking 0/1/2, only
# 1 socket fd would be available — not enough for DNS + TLS simultaneously.
# Set to 8: fds 0-2 = stdio, fds 3-7 = up to 5 concurrent sockets.
CONFIG_ZVFS_OPEN_MAX=8

# ── Base64 (for AT%KEYGEN DER→PEM conversion on nRF9151) ─────────────────────
CONFIG_BASE64=y

# ── JSON ──────────────────────────────────────────────────────────────────────
CONFIG_CJSON_LIB=y

# ── Date/time (NTP sync for ISO-8601 timestamps) ──────────────────────────────
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y

# ── Settings (persists "provisioned" flag across reboots) ─────────────────────
# Use NVS backend so Settings and the reboot counter share the same NVS
# instance on storage_partition without conflict.
# FCB and NVS cannot safely share the same partition simultaneously.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ── NVS (reboot counter + Settings NVS backend) ───────────────────────────────
CONFIG_NVS=y

# ── Stack / heap ──────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=16384
# Heap must cover: cJSON CSR request (~1.5KB) + cert response parse (~1.7KB) +
# NVS Settings backend metadata + modem library allocations.
# 16384 was too tight — 65536 matches the working fleet-provisioning sample.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Stack debugging
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
# Print PC/LR/SP in fault dump so we can pinpoint the crash address
CONFIG_EXTRA_EXCEPTION_INFO=y

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Use immediate (synchronous) mode so logs flush before a fault kills the system.
# Deferred mode can lose the last log line if a crash happens before the log
# thread processes it.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=y

# ── Safety ────────────────────────────────────────────────────────────────────
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_FAULT_DUMP=2
CONFIG_STACK_SENTINEL=y
CONFIG_BOOTLOADER_MCUBOOT=y
