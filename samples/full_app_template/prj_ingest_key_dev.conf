# =============================================================================
# prj_ingest_key_dev.conf — Ingest Key overlay for the DEV environment
#
# Apply on top of prj_ingest_key.conf for dev builds:
#   west build -b conexio_stratus_pro/nrf9151/ns --pristine \
#              -- -DEXTRA_CONF_FILE="prj_ingest_key.conf;prj_ingest_key_dev.conf"
#
# Steps:
#   1. Register the device IMEI in the dev console (d3lwq39x4chaqi.cloudfront.net)
#      → Device Manager → + Add Device
#   2. Get a dev ingest key from dev console → Organization → Ingest Keys
#   3. Set CONFIG_CONEXIO_CLOUD_INGEST_KEY in prj_ingest_key.conf (never commit it)
#   4. Build with BOTH overlays as shown above
#
# Why this file is needed:
#   ingest.mqtt.cloud.conexiotech.com is the PRODUCTION endpoint and routes to
#   ConexioIngestKeyAuthorizerProd. Dev ingest keys are validated by
#   ConexioIngestKeyAuthorizerDev which listens on a separate AWS-managed endpoint.
#   This overlay points the SDK at the dev domain config endpoint instead.
# =============================================================================

# Dev ingest endpoint — AWS-managed domain for conexio-ingest-dev domain config.
# This endpoint has ConexioIngestKeyAuthorizerDev attached which validates
# keys against iot-dashboard-ingest-keys-dev (dev DynamoDB table).
CONFIG_CONEXIO_CLOUD_INGEST_ENDPOINT="d04820601bybhat5l4fpv-ats.iot.us-east-1.amazonaws.com"
