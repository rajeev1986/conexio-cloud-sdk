# Thingy:91 uses an ADP5360 PMIC — no nPM1300, no pmic_charger DT node.
# Disable nRF Fuel Gauge and battery metrics to suppress the device-not-ready
# warning and avoid compiling in unused fuel gauge code.
# CONFIG_REGULATOR, CONFIG_SENSOR, and CONFIG_I2C are left unchanged;
# they are needed for other Thingy:91 hardware.
CONFIG_CONEXIO_CLOUD_BATTERY_METRICS=n
CONFIG_NRF_FUEL_GAUGE=n
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=n
