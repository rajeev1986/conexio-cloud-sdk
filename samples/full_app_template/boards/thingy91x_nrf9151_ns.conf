# Thingy:91 X has an nPM1300 PMIC but its charger node is labeled
# npm1300_charger (not pmic_charger), and its battery is the LP803448
# (not the LP963450 model built into the SDK fuel gauge). Enabling the
# fuel gauge with a mismatched battery model produces incorrect SOC readings.
# Disable battery metrics; the nPM1300 regulators remain active for the
# board's power rails (CONFIG_REGULATOR stays enabled from prj.conf).
CONFIG_CONEXIO_CLOUD_BATTERY_METRICS=n
CONFIG_NRF_FUEL_GAUGE=n
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=n
