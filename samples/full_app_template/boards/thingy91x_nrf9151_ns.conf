# Thingy:91 X has an nPM1300 PMIC. The base DTS defines npm1300_charger
# (status=disabled) — the overlay adds the pmic_charger label and enables it.
# Battery metrics and fuel gauge are enabled here to match the Stratus Pro.
#
# Note: Thingy:91 X uses an LP803448 LiPol (675 mA, 4.2 V) — the charge
# specs differ from the Stratus Pro LP963450 but both work with the nRF Fuel
# Gauge library. SOC accuracy depends on how closely the battery model in the
# SDK matches the LP803448; tune CONFIG_CONEXIO_FUEL_GAUGE_PSM_SLEEP_CURRENT_UA
# for your actual board sleep current if needed.
CONFIG_CONEXIO_CLOUD_BATTERY_METRICS=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
