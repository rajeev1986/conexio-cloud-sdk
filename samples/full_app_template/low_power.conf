# Low-power build overlay — disable serial logging to reduce power consumption.
#
# Usage (build alongside prj.conf):
#   west build -b conexio_stratus_pro/nrf9151/ns -- \
#     -DEXTRA_CONF_FILE=low_power.conf
#
# Effect:
#   - UART console disabled → ~1-2 mA saving in active mode
#   - LOG subsystem disabled → no formatting overhead, smaller binary
#   - Combined with the boards/conexio_stratus_pro_nrf9151_ns.overlay which
#     deletes the UART RX pin to prevent floating-pin current leakage.
#

# Disable serial (UART console)
CONFIG_SERIAL=n

# Disable logging subsystem
CONFIG_LOG=n
