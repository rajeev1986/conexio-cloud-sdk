# Low-power build overlay — disable serial logging and enable modem sleep
# event tracking so the device reaches µA-level sleep current between
# telemetry transmissions.
#
# Usage (build alongside prj.conf):
#   west build -b conexio_stratus_pro/nrf9151/ns -- \
#     -DEXTRA_CONF_FILE=low_power.conf
#
# What this overlay does:
#   1. Disables UART console → ~1-2 mA saving in active mode
#   2. Disables LOG subsystem → no formatting overhead, smaller binary
#   3. Enables LTE modem sleep module → power_mgr.c receives
#      LTE_LC_EVT_MODEM_SLEEP_ENTER / EXIT events so it can:
#        - set g_psm_sleeping = true (gate for power_mgr_is_psm_active)
#        - notify the nPM1300 fuel gauge to stop 1 Hz sampling during PSM
#        - give the modem_ready_sem so power_mgr_wake() unblocks cleanly
#   4. Enables LTE PSM module → power_mgr.c receives LTE_LC_EVT_PSM_UPDATE
#      events confirming the network-granted TAU/T3324 timers
#
# Without items 3 and 4, the modem hardware still enters PSM sleep but the
# SDK never knows:
#   - g_psm_sleeping stays false → power_mgr_is_psm_active() always false
#   - Fuel gauge keeps sampling at 1 Hz the entire sleep period (wasted)
#   - modem_ready_sem is never signalled → power_mgr_wake() always times out
#     instead of unblocking immediately when the modem wakes naturally
#
# Combined with the boards/conexio_stratus_pro_nrf9151_ns.overlay which
# deletes the UART RX pin to prevent floating-pin current leakage.
#

# ── Disable serial console and logging ───────────────────────────────────────
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ── LTE modem sleep event tracking ───────────────────────────────────────────
# Enables LTE_LC_EVT_MODEM_SLEEP_ENTER and LTE_LC_EVT_MODEM_SLEEP_EXIT events
# in the power_mgr.c LTE event handler. Required for:
#   - g_psm_sleeping flag (gates power_mgr_is_psm_active())
#   - Fuel gauge sleep/wake notifications (conexio_fuel_gauge_on_sleep_enter/exit)
#   - modem_ready_sem signalling so power_mgr_wake() unblocks on PSM exit
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y

# ── LTE PSM update events ─────────────────────────────────────────────────────
# Enables LTE_LC_EVT_PSM_UPDATE events so power_mgr.c can track whether the
# network has actually granted PSM (g_psm_active flag). Without this, the SDK
# cannot distinguish "PSM granted" from "PSM denied" at runtime.
CONFIG_LTE_LC_PSM_MODULE=y
