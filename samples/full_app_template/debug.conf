#
# Debug build overlay — enables verbose logging and assertions for development.
#
# Usage (build alongside prj.conf):
#   west build -b conexio_stratus_pro/nrf9151/ns -- \
#     -DEXTRA_CONF_FILE=debug.conf
#
# Effect:
#   - LOG_DEFAULT_LEVEL=4 (DBG) — all module logs including <dbg> output
#   - LOG_BUFFER_SIZE increased — prevents buffer overrun with verbose output
#   - ASSERT=y — enables __ASSERT() checks throughout Zephyr and the SDK;
#     a failed assertion halts the device with a descriptive crash log
#   - FAULT_DUMP=2 — full register + stack dump on any hard fault
#   - RESET_ON_FATAL_ERROR=n — halts on fatal error instead of rebooting,
#     so you can read the crash log over UART before it disappears
#
# Remove -DEXTRA_CONF_FILE=debug.conf for production/release builds.
#

# Verbose logging — level 4 = DBG (ERR=1, WRN=2, INF=3, DBG=4)
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=8192

# Assertions — catch logic errors early during development
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# Full crash dump — register state + stack trace on hard fault
CONFIG_FAULT_DUMP=2

# Halt on fatal error instead of rebooting — keep crash log visible on UART
CONFIG_RESET_ON_FATAL_ERROR=n
