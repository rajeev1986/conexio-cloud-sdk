# =============================================================================
# Conexio Console — MQTT/TLS sample for nRF91xx
# nRF Connect SDK v3.2.1
# =============================================================================

# ── Device identity ───────────────────────────────────────────────────────────
# Must match the AWS IoT Thing name exactly.
# Set your device ID (e.g. IMEI or custom identifier)
CONFIG_CONEXIO_DEVICE_ID="your-device-id"
# Set your AWS IoT Core endpoint: aws iot describe-endpoint --endpoint-type iot:Data-ATS
CONFIG_CONEXIO_AWS_BROKER_HOSTNAME="your-endpoint.iot.REGION.amazonaws.com"

# ── Telemetry / keepalive ─────────────────────────────────────────────────────
# TESTING: 60s interval — fast enough to verify connect→publish→disconnect cycle.
# Change to 1800 for overnight battery test.
# AWS IoT Core maximum keepalive = 1200s (20 min).
# With Option B (disconnect after publish) keepalive only applies during the
# brief ~10s active window, so its value doesn't affect battery life.
CONFIG_CONEXIO_TELEMETRY_INTERVAL_SEC=1800
CONFIG_CONEXIO_MQTT_KEEPALIVE_SEC=1200

# ── LTE / modem ───────────────────────────────────────────────────────────────
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=y
# LTE_LC_CONNECTION_STATUS_MODULE is default y — provides CELL_UPDATE + LTE_MODE_UPDATE events

# ── Modem info — all categories needed for full SDK metrics ───────────────────
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y   # _rssi, _cell_id, _tac, _lte_band, _operator
CONFIG_MODEM_INFO_ADD_DEVICE=y    # _modem_fw, _battery_mv, _modem_temp

# ── hwinfo — required for _reboot_reason metric ───────────────────────────────
CONFIG_HWINFO=y

# ── Networking — offloaded stack (nRF91xx modem handles IP+TLS) ───────────────
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# ── C library ─────────────────────────────────────────────────────────────────
CONFIG_NEWLIB_LIBC=y
# Enable float support in printf/snprintf — required with newlib-nano
# (-specs=nano.specs), otherwise %.1f prints literally as "%.1f".
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ── TLS credential management ─────────────────────────────────────────────────
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y

# ── MQTT ──────────────────────────────────────────────────────────────────────
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_CLEAN_SESSION=y

# ── JSON (cJSON) ──────────────────────────────────────────────────────────────
# cJSON is compiled directly from ${ZEPHYR_CJSON_MODULE_DIR}/cJSON.c in
# CMakeLists.txt — no need for CONFIG_CJSON_LIB=y (which uses cmake-ext and
# doesn't link the library into the app automatically with NEWLIB_LIBC).
# CONFIG_CJSON_LIB=y

# ── Date/time (for ISO-8601 timestamps) ───────────────────────────────────────
# CONFIG_POSIX_THREADS provides pthread_attr_t which is required by
# <zephyr/posix/signal.h>, pulled in transitively by date_time_modem.c.
# Without it, NEWLIB_LIBC + DATE_TIME fails to compile with:
#   "unknown type name 'pthread_attr_t'"
CONFIG_POSIX_THREADS=y
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y

# ── NVS flash (for persistent reboot counter) ─────────────────────────────────
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ── Stack / heap ──────────────────────────────────────────────────────────────
# Increased heap: cJSON builds telemetry payload with ~20 fields including
# boot-once string metrics (_modem_fw, _operator, _sdk_version, _reboot_reason).
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=y

# ── Safety ────────────────────────────────────────────────────────────────────
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FAULT_DUMP=2
CONFIG_BOOTLOADER_MCUBOOT=y
