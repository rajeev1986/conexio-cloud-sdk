# =============================================================================
# Conexio Advanced Sample App — prj.conf
# nRF Connect SDK v3.2.1 / Conexio Stratus Pro (nRF9151)
# =============================================================================

# ── Conexio Cloud SDK (Phase 2 — zero-config) ─────────────────────────────────
# No endpoint needed — fetched at runtime from config.conexio.io using the
# device IMEI as identity (read directly from the modem).
# Flash conexio-stratus-provision first so the device certificate and private
# key are stored in the modem before building and flashing this application.
CONFIG_CONEXIO_CLOUD=y
CONFIG_CONEXIO_CLOUD_MQTT=y
CONFIG_CONEXIO_CLOUD_INTERVAL_SEC=3600

# ── Static broker override ────────────────────────────────────────────────────
# Bypasses config.conexio.io and connects directly to our AWS IoT Core endpoint.
# Remove once the Conexio config service is set up for this workspace.
CONFIG_CONEXIO_CLOUD_STATIC_BROKER_ENABLED=y
CONFIG_CONEXIO_CLOUD_STATIC_BROKER="a2t1ogibbsuad8-ats.iot.us-east-1.amazonaws.com"
CONFIG_CONEXIO_CLOUD_STATIC_ROOT_CA_URL="https://www.amazontrust.com/repository/AmazonRootCA1.pem"

# ── Power Saving Mode (PSM) ───────────────────────────────────────────────────
CONFIG_CONEXIO_CLOUD_PSM=y
CONFIG_CONEXIO_CLOUD_PSM_TAU_SEC=7200
CONFIG_CONEXIO_CLOUD_PSM_ACTIVE_TIME_SEC=30

# ── Offline telemetry buffer ───────────────────────────────────────────────────
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER=y
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER_SIZE=100
CONFIG_CONEXIO_CLOUD_OFFLINE_REPLAY_BATCH=10

# ── FOTA — Firmware Over-the-Air updates ──────────────────────────────────────
CONFIG_CONEXIO_CLOUD_FOTA=y
CONFIG_CONEXIO_CLOUD_FOTA_DOWNLOAD_TIMEOUT_SEC=300
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_DOWNLOADER=y
CONFIG_FOTA_DOWNLOAD=y
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y

# ── Retry / watchdog ──────────────────────────────────────────────────────────
CONFIG_CONEXIO_CLOUD_RETRY=y
CONFIG_CONEXIO_CLOUD_RETRY_BASE_SEC=5
CONFIG_CONEXIO_CLOUD_RETRY_MAX_SEC=300
CONFIG_CONEXIO_CLOUD_RETRY_MAX_ATTEMPTS=10
CONFIG_CONEXIO_CLOUD_WATCHDOG_TIMEOUT_SEC=600

# ── LTE / Modem ───────────────────────────────────────────────────────────────
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y
# LTE_LC_CONNECTION_STATUS_MODULE is default y — provides CELL_UPDATE + LTE_MODE_UPDATE

# ── Modem info — all categories for full SDK metrics ─────────────────────────
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y   # _rssi, _cell_id, _tac, _lte_band, _operator
CONFIG_MODEM_INFO_ADD_DEVICE=y    # _modem_fw, _battery_mv, _modem_temp

# ── Battery voltage (_battery_mv) ─────────────────────────────────────────────
# Source: nPM1300 fuel gauge (SENSOR_CHAN_GAUGE_VOLTAGE via pmic_charger).
# The read_battery_mv() sensor callback in main.c reads the fuel gauge and
# returns millivolts. The SDK publishes this as _battery_mv on every cycle.
# CONFIG_CONEXIO_CLOUD_AUTO_BATTERY is intentionally disabled — the modem
# AT%XVBAT ADC reading is replaced by the more accurate fuel gauge value.
CONFIG_CONEXIO_CLOUD_AUTO_BATTERY=n

# nPM1300 PMIC + fuel gauge
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ── hwinfo — reboot reason (_reboot_reason metric) ───────────────────────────
# Already selected by CONFIG_CONEXIO_CLOUD via 'select HWINFO' in SDK Kconfig.
# Explicit here for clarity.
CONFIG_HWINFO=y

# ── GPIO ──────────────────────────────────────────────────────────────────────
# Required for LED_ON / LED_OFF command handlers (on-board LED, gpio0 pin 25).
# Also needed for any application-level GPIO usage (buttons, relays, etc.).
CONFIG_GPIO=y

# ── Networking ────────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=1200
CONFIG_HTTP_CLIENT=y

# ── C library ─────────────────────────────────────────────────────────────────
# NEWLIB_LIBC initialises fdtable[0/1/2] with stdin/stdout/stderr, preventing
# the fd=0 BusFault that occurs when the first TLS socket gets fd=0.
# This is the root cause fix for the BusFault at mqtt_connect() that affected
# the mqtt sample before NEWLIB_LIBC was added.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# CONFIG_POSIX_THREADS provides pthread_attr_t required by <zephyr/posix/signal.h>
# which is pulled in transitively by date_time_modem.c. Without it, NEWLIB_LIBC
# + DATE_TIME fails with "unknown type name 'pthread_attr_t'".
CONFIG_POSIX_THREADS=y

# ── JSON (cJSON) ──────────────────────────────────────────────────────────────
# CONFIG_CJSON_LIB=y is auto-selected by CONFIG_CONEXIO_CLOUD but with
# NEWLIB_LIBC the cmake-ext build doesn't link the library automatically.
# CMakeLists.txt compiles cJSON.c directly as part of the app instead.
# CONFIG_CJSON_LIB=y  # auto-selected, but cmake-ext doesn't link it

# ── Date/time ─────────────────────────────────────────────────────────────────
# Auto-selected by CONFIG_CONEXIO_CLOUD. Listed explicitly for clarity.
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y

# ── NVS (for offline buffer + reboot counter) ─────────────────────────────────
# Auto-selected by CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER. Explicit for clarity.
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ── Stack / heap ──────────────────────────────────────────────────────────────
# Increased heap: cJSON builds telemetry with 20+ metrics + FOTA job parsing
# + offline buffer JSON + HTTP client response buffer in cert_store.c.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=8192

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=y

# ── TLS security tags ─────────────────────────────────────────────────────────
# SDK Kconfig defaults (100/101/102) match the tags written by the
# conexio-stratus-provision sample — no override needed.
#   Tag 100 — AWS Root CA         (CONFIG_CONEXIO_CLOUD_CA_TAG)
#   Tag 101 — Device public cert  (CONFIG_CONEXIO_CLOUD_CERT_TAG)  ← from fleet provisioning
#   Tag 102 — Device private key  (CONFIG_CONEXIO_CLOUD_KEY_TAG)   ← from fleet provisioning (AT%KEYGEN)

# ── Reset on fatal ────────────────────────────────────────────────────────────
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FAULT_DUMP=2
