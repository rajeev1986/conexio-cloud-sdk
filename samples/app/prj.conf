# =============================================================================
# Conexio Advanced Sample App — prj.conf
# nRF Connect SDK v3.2.1 / Conexio Stratus Pro (nRF9151)
#
# Most SDK dependencies (MQTT, modem, NTP, NVS, flash, FOTA subsystems,
# TLS, HTTP client, HWINFO, etc.) are auto-selected by CONFIG_CONEXIO_CLOUD
# via the SDK Kconfig. Only application-level overrides and options that
# have no SDK Kconfig equivalent are listed here.
# =============================================================================

# ── Conexio Cloud SDK ─────────────────────────────────────────────────────────
# CONFIG_CONEXIO_CLOUD=y is the only required entry. Everything else is
# auto-selected by the SDK Kconfig (MQTT, TLS, modem lib, NTP, etc.).
CONFIG_CONEXIO_CLOUD=y

# Telemetry publish interval in seconds. Valid range: 10–604800 (7 days).
# 60 = publish every 60 seconds. Increase for longer battery life.
CONFIG_CONEXIO_CLOUD_INTERVAL_SEC=60

# ── Power Saving Mode (PSM) ───────────────────────────────────────────────────
# PSM puts the modem into µA-level sleep between transmissions.
#
# INTERVAL_SEC and PSM_TAU_SEC are intentionally independent:
#   - INTERVAL_SEC controls how often the app publishes telemetry
#   - PSM_TAU_SEC is a hint to the network — the carrier will grant its own
#     TAU value regardless (AT&T LTE-M typically grants 3-4 hours minimum)
#
# The SDK handles this correctly: power_mgr_wake() times out after INTERVAL_SEC
# so the device reconnects and publishes on schedule even when TAU > INTERVAL.
# The modem stays in the T3324 active window between publishes when TAU > INTERVAL.
#
# For best battery life on production: set both to the same value and let the
# device sleep fully between cycles. The carrier-granted TAU sets the actual
# sleep duration (e.g. AT&T grants ~3.5h minimum on Band 13).
CONFIG_CONEXIO_CLOUD_PSM=y
# Request 1-hour TAU — network will grant its minimum (AT&T: ~3.5h on Band 13).
# INTERVAL_SEC and TAU are decoupled — device publishes at INTERVAL_SEC rate.
CONFIG_CONEXIO_CLOUD_PSM_TAU_SEC=3600
# Stay awake 30s after each TAU wake (T3324 active timer)
CONFIG_CONEXIO_CLOUD_PSM_ACTIVE_TIME_SEC=30

# ── Offline telemetry buffer ──────────────────────────────────────────────────
# Stores telemetry in flash when offline; replays to cloud on reconnect.
# 100 entries at 60s interval = ~100 minutes of offline coverage.
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER=y
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER_SIZE=100
CONFIG_CONEXIO_CLOUD_OFFLINE_REPLAY_BATCH=10

# ── FOTA — Firmware Over-the-Air updates ──────────────────────────────────────
CONFIG_CONEXIO_CLOUD_FOTA=y
# Note: FOTA_DOWNLOAD_TIMEOUT_SEC is kept for documentation but is no longer
# passed to fota_download_start() in NCS v3.2.1. The actual timeout is
# controlled by CONFIG_FOTA_DOWNLOAD_TIMEOUT_MS (NCS default: 600000 ms).
CONFIG_CONEXIO_CLOUD_FOTA_DOWNLOAD_TIMEOUT_SEC=300

# Conexio Cloud firmware download URLs carry a large query string (~1700 chars).
# NCS default DOWNLOADER_MAX_FILENAME_SIZE=255 truncates the URL → HTTP 403.
# No SDK Kconfig equivalent — must be set explicitly here.
CONFIG_DOWNLOADER_STACK_SIZE=2048
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=2048

# ── Retry / watchdog ──────────────────────────────────────────────────────────
# Exponential backoff reconnection: 5s → 10s → 20s → ... → 300s.
# After 10 consecutive failures the device reboots (catches modem hangs).
# Hardware watchdog fires after 600s if the SDK loop stalls.
CONFIG_CONEXIO_CLOUD_RETRY=y
CONFIG_CONEXIO_CLOUD_RETRY_BASE_SEC=5
CONFIG_CONEXIO_CLOUD_RETRY_MAX_SEC=300
CONFIG_CONEXIO_CLOUD_RETRY_MAX_ATTEMPTS=10
CONFIG_CONEXIO_CLOUD_WATCHDOG_TIMEOUT_SEC=600

# ── Modem info categories ─────────────────────────────────────────────────────
# MODEM_INFO itself is auto-selected by CONFIG_CONEXIO_CLOUD. These two NCS
# options (not in SDK Kconfig, default=n) enable additional metric groups:
#   ADD_NETWORK → _rssi, _snr, _cell_id, _tac, _lte_band, _operator
#   ADD_DEVICE  → _modem_fw, _modem_temp
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y

# ── Battery voltage (_battery_mv) ─────────────────────────────────────────────
# Stratus Pro uses the nPM1300 fuel gauge for accurate battery voltage.
# read_battery_mv() in main.c reads SENSOR_CHAN_GAUGE_VOLTAGE and publishes
# it as _battery_mv. The less accurate modem AT%XVBAT path is disabled here.
# To revert to modem ADC: set CONFIG_CONEXIO_CLOUD_AUTO_BATTERY=y and remove
# the nPM1300 block below.
CONFIG_CONEXIO_CLOUD_AUTO_BATTERY=n

# ── Battery health metrics (nPM1300 fuel gauge) ────────────────────────────────
# Publishes additional battery metrics from the nPM1300 on every telemetry cycle:
#   _battery_soc_pct      — state of charge in percent (0–100)
#   _battery_drain_pct_hr — average drain rate in %/hour (discharge only)
CONFIG_CONEXIO_CLOUD_BATTERY_METRICS=y

# nPM1300 PMIC + nRF Fuel Gauge
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ── GPIO ──────────────────────────────────────────────────────────────────────
# Required for LED_ON / LED_OFF command handlers (on-board LED, gpio0 pin 25).
CONFIG_GPIO=y

# ── C library ─────────────────────────────────────────────────────────────────
# NEWLIB_LIBC initialises fdtable[0/1/2] preventing a fd=0 BusFault when the
# first TLS socket is allocated. Required alongside MQTT over TLS.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
# POSIX_THREADS provides pthread_attr_t pulled in by date_time_modem.c.
CONFIG_POSIX_THREADS=y

# ── Stack / heap ──────────────────────────────────────────────────────────────
# Increase MAIN_STACK_SIZE if you see stack overflow crashes in main().
# Increase HEAP_MEM_POOL_SIZE if cJSON or FOTA job parsing fails with -ENOMEM.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=8192

# ── Logging ───────────────────────────────────────────────────────────────────
# Level 3 = INF (ERR=1, WRN=2, INF=3, DBG=4).
# For production/low-power builds use low_power.conf (CONFIG_LOG=n).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=y

# ── Reset on fatal error ──────────────────────────────────────────────────────
# Level 2 = full register + stack dump on fault before reset.
# Ensures field devices recover from hard faults instead of hanging.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FAULT_DUMP=2

# ── Build overlays ────────────────────────────────────────────────────────────
# low_power.conf — disables UART console and logging for production/field builds:
#   west build ... -- -DEXTRA_CONF_FILE=low_power.conf
#
# debug.conf — enables DBG-level logging and assertions for development:
#   west build ... -- -DEXTRA_CONF_FILE=debug.conf

# ── Cellular location (AWS Location Service) ──────────────────────────────────
# Enables AT%NCELLMEAS neighbour cell measurement. Collected data is published
# as telemetry metrics and resolved to coordinates by the cloud Lambda:
#   _loc_mcc, _loc_mnc   — serving cell operator codes
#   _loc_cell_id, _loc_tac — cell and tracking area identifiers
#   _loc_earfcn, _loc_rsrp — frequency and signal strength
#   _loc_timing_adv      — distance proxy (~100 m resolution, when available)
#   _loc_neighbors       — JSON array of neighbour cells for better accuracy
#
# LTE_LC_NEIGHBOR_CELL_MEAS_MODULE is auto-selected by CONFIG_CELL_LOCATION
# in the SDK Kconfig — no extra entry needed here.
CONFIG_CELL_LOCATION=y

# How often to trigger a cell measurement, in seconds.
# Independent of the telemetry interval — publish telemetry frequently
# while only calling the positioning API a few times per day.
#
# Recommended values:
#   28800  (8 hours)  — 3 fixes/day, typical production field tracking  ← default
#   14400  (4 hours)  — 6 fixes/day, moderate tracking
#   3600   (1 hour)   — 24 fixes/day, high-frequency tracking
#   60     (1 min)    — development / pipeline testing only
#
# Cost guide (HERE Base Plan, 3 fixes/device/day):
#   10 devices  →   ~900 req/month — within free tier
#   100 devices →  ~9,000 req/month — ~$9/month at $1/1,000
CONFIG_CELL_LOCATION_INTERVAL_SEC=14400

# Neighbour cell search type — controls AT%NCELLMEAS scan depth.
# Uncomment ONE line to override the SDK default (1 = EXTENDED_LIGHT):
#   0 = DEFAULT        — fast (~1-3 s),   0-2  neighbours, accuracy ~±1-5 km
#   1 = EXTENDED_LIGHT — moderate (~3-8 s), 3-8  neighbours, accuracy ~±300m-1km (SDK default)
#   2 = EXTENDED       — thorough (~5-15 s), up to 17 neighbours, best accuracy
# CONFIG_CELL_LOCATION_SEARCH_TYPE=0
# CONFIG_CELL_LOCATION_SEARCH_TYPE=2

# Publish telemetry immediately after a location fix (default y).
# Set to n to let _loc_* metrics ride the next scheduled publish instead.
# CONFIG_CELL_LOCATION_PUBLISH_ON_FIX=n

# ── SDK improvements (sdk-improvements branch) ────────────────────────────────

# Session Run ID — a random 32-bit hex string generated at boot. Emitted once
# as _session_id in the first payload. Lets the cloud correlate all packets
# from one power-on session across MQTT reconnects without a flash write.
# Always enabled — no Kconfig option needed (zero-cost, zero-config).

# FOTA maintenance window — deferred start callback.
# Register via conexio_cloud_set_fota_can_start_cb() in main.c.
# Retry interval while waiting for the maintenance window to open:
# CONFIG_FOTA_PAUSE_RETRY_SEC=60   # default: check once per minute

# FOTA installed version check — automatically skips re-downloading a
# firmware version that is already installed. Enabled automatically when
# CONFIG_CONEXIO_CLOUD_FOTA=y. No extra Kconfig entry needed.

# Delta encoding for static LTE metrics — _lte_band, _cell_id, _tac are now
# only emitted when the value changes (plus on boot and every slow_interval
# as a heartbeat). Enabled automatically. No extra Kconfig entry needed.

# Cloud log streaming — forward Zephyr log messages to the cloud as a
# "_log" JSON array inside the regular telemetry payload.
# Default: disabled (n). Enable in prj.conf for field diagnostics.
# CONFIG_CONEXIO_CLOUD_LOG_STREAM=y
#
# Minimum severity to forward (0=DBG 1=INF 2=WRN 3=ERR). Default: 2 (WRN).
# CONFIG_CONEXIO_CLOUD_LOG_LEVEL=3
#
# Ring buffer depth (number of entries). Default: 16.
# CONFIG_CONEXIO_CLOUD_LOG_QUEUE_SIZE=16
#
# Max characters per log message. Default: 80.
# CONFIG_CONEXIO_LOG_MSG_LEN=80

# ── Topic architecture (production hardening) ─────────────────────────────────

# Topic version prefix — all D2C topics take the form:
#   {prefix}/devices/{deviceId}/{type}
# Default "v1". Change only when a breaking schema change is required.
# CONFIG_CONEXIO_CLOUD_TOPIC_VERSION="v1"

# ACK retry limit — number of times to retry a failed command/config ACK
# before dropping it. Default 5 (covers ~2.5s of outage at 500ms poll).
# CONFIG_CONEXIO_CLOUD_ACK_RETRY_MAX=5
