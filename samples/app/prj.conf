# =============================================================================
# Conexio Advanced Sample App — prj.conf
# nRF Connect SDK v3.2.1 / Conexio Stratus Pro (nRF9151)
#
# Most SDK dependencies (MQTT, modem, NTP, NVS, flash, FOTA subsystems,
# TLS, HTTP client, HWINFO, etc.) are auto-selected by CONFIG_CONEXIO_CLOUD
# via the SDK Kconfig. Only application-level overrides and options that
# have no SDK Kconfig equivalent are listed here.
# =============================================================================

# ── Conexio Cloud SDK ─────────────────────────────────────────────────────────
# CONFIG_CONEXIO_CLOUD=y is the only required entry. Everything else is
# auto-selected by the SDK Kconfig (MQTT, TLS, modem lib, NTP, etc.).
CONFIG_CONEXIO_CLOUD=y

# Telemetry publish interval in seconds. Valid range: 10–3600.
# 60 = publish every 60 seconds. Increase for longer battery life.
CONFIG_CONEXIO_CLOUD_INTERVAL_SEC=60

# ── Power Saving Mode (PSM) ───────────────────────────────────────────────────
# PSM puts the modem into µA-level sleep between transmissions.
# Rule of thumb: TAU_SEC should be at least 2× your telemetry interval.
# ACTIVE_TIME_SEC must cover LTE re-registration + publish (~10–30s typical).
CONFIG_CONEXIO_CLOUD_PSM=y
CONFIG_CONEXIO_CLOUD_PSM_TAU_SEC=7200       # Network keepalive every 2 hours
CONFIG_CONEXIO_CLOUD_PSM_ACTIVE_TIME_SEC=30 # Stay awake 30s after each wake

# ── Offline telemetry buffer ──────────────────────────────────────────────────
# Stores telemetry in flash when offline; replays to cloud on reconnect.
# 100 entries at 60s interval = ~100 minutes of offline coverage.
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER=y
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER_SIZE=100
CONFIG_CONEXIO_CLOUD_OFFLINE_REPLAY_BATCH=10

# ── FOTA — Firmware Over-the-Air updates ──────────────────────────────────────
CONFIG_CONEXIO_CLOUD_FOTA=y
# Note: FOTA_DOWNLOAD_TIMEOUT_SEC is kept for documentation but is no longer
# passed to fota_download_start() in NCS v3.2.1. The actual timeout is
# controlled by CONFIG_FOTA_DOWNLOAD_TIMEOUT_MS (NCS default: 600000 ms).
CONFIG_CONEXIO_CLOUD_FOTA_DOWNLOAD_TIMEOUT_SEC=300

# Conexio Cloud firmware download URLs carry a large query string (~1700 chars).
# NCS default DOWNLOADER_MAX_FILENAME_SIZE=255 truncates the URL → HTTP 403.
# No SDK Kconfig equivalent — must be set explicitly here.
CONFIG_DOWNLOADER_STACK_SIZE=2048
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=2048

# ── Retry / watchdog ──────────────────────────────────────────────────────────
# Exponential backoff reconnection: 5s → 10s → 20s → ... → 300s.
# After 10 consecutive failures the device reboots (catches modem hangs).
# Hardware watchdog fires after 600s if the SDK loop stalls.
CONFIG_CONEXIO_CLOUD_RETRY=y
CONFIG_CONEXIO_CLOUD_RETRY_BASE_SEC=5
CONFIG_CONEXIO_CLOUD_RETRY_MAX_SEC=300
CONFIG_CONEXIO_CLOUD_RETRY_MAX_ATTEMPTS=10
CONFIG_CONEXIO_CLOUD_WATCHDOG_TIMEOUT_SEC=600

# ── Modem info categories ─────────────────────────────────────────────────────
# MODEM_INFO itself is auto-selected by CONFIG_CONEXIO_CLOUD. These two NCS
# options (not in SDK Kconfig, default=n) enable additional metric groups:
#   ADD_NETWORK → _rssi, _snr, _cell_id, _tac, _lte_band, _operator
#   ADD_DEVICE  → _modem_fw, _modem_temp
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y

# ── Battery voltage (_battery_mv) ─────────────────────────────────────────────
# Stratus Pro uses the nPM1300 fuel gauge for accurate battery voltage.
# read_battery_mv() in main.c reads SENSOR_CHAN_GAUGE_VOLTAGE and publishes
# it as _battery_mv. The less accurate modem AT%XVBAT path is disabled here.
# To revert to modem ADC: set CONFIG_CONEXIO_CLOUD_AUTO_BATTERY=y and remove
# the nPM1300 block below.
CONFIG_CONEXIO_CLOUD_AUTO_BATTERY=n

# nPM1300 PMIC + nRF Fuel Gauge
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ── GPIO ──────────────────────────────────────────────────────────────────────
# Required for LED_ON / LED_OFF command handlers (on-board LED, gpio0 pin 25).
CONFIG_GPIO=y

# ── C library ─────────────────────────────────────────────────────────────────
# NEWLIB_LIBC initialises fdtable[0/1/2] preventing a fd=0 BusFault when the
# first TLS socket is allocated. Required alongside MQTT over TLS.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
# POSIX_THREADS provides pthread_attr_t pulled in by date_time_modem.c.
CONFIG_POSIX_THREADS=y

# ── Stack / heap ──────────────────────────────────────────────────────────────
# Increase MAIN_STACK_SIZE if you see stack overflow crashes in main().
# Increase HEAP_MEM_POOL_SIZE if cJSON or FOTA job parsing fails with -ENOMEM.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=8192

# ── Logging ───────────────────────────────────────────────────────────────────
# Level 3 = INF (ERR=1, WRN=2, INF=3, DBG=4).
# For production/low-power builds use low_power.conf (CONFIG_LOG=n).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=y

# ── Reset on fatal error ──────────────────────────────────────────────────────
# Level 2 = full register + stack dump on fault before reset.
# Ensures field devices recover from hard faults instead of hanging.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FAULT_DUMP=2
