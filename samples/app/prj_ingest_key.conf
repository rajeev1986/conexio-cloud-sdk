# =============================================================================
# prj_ingest_key.conf — Ingest Key authentication overlay
#
# Developer quick-connect: authenticate via MQTT Custom Authorizer
# without fleet-provisioned TLS certificates.
#
# Usage:
#   west build -b conexio_stratus_pro/nrf9151/ns --pristine \
#              -- -DEXTRA_CONF_FILE=prj_ingest_key.conf
#
# Steps before building:
#   1. Register the device IMEI in Conexio Console → All Devices → + Add Device
#      (The IMEI is printed on the hardware label or read via: AT+CGSN)
#   2. Get an ingest key from Conexio Console → Organization → Ingest Keys
#   3. Get the ingest endpoint hostname:
#        aws iot describe-domain-configuration \
#          --domain-configuration-name conexio-ingest \
#          --query domainName --output text
#   4. Fill in BOTH values below
#
# ⚠ WARNING: Replace the placeholder values before building.
#            Never commit a file containing a real ingest key to version control.
#            Add your per-developer copy (e.g. prj_ingest_key_dev.conf) to .gitignore.
#
# How it works (Option C — IoT Core domain config):
#   The device IMEI is read automatically from the modem at boot.
#   MQTT connects on port 8883 (standard TLS, no ALPN) to the dedicated
#   ingest endpoint. AWS IoT Core invokes the Custom Authorizer Lambda which
#   decodes the ingest key from the MQTT password field and validates it
#   against the DynamoDB key store + device registration.
#
#   MQTT fields set by firmware:
#     clientId  = IMEI
#     username  = IMEI
#     password  = ingest key  (base64-encoded by IoT Core before Lambda sees it)
# =============================================================================

# ── Ingest Key ────────────────────────────────────────────────────────────────
# Paste the full key from Conexio Console → Organization → Ingest Keys.
# Format: wks_<8chars>_<32chars>
CONFIG_CONEXIO_CLOUD_INGEST_KEY="wks_14988448_6c8dccf3ed79280d93ddef2d334f41cb"

# ── Ingest Endpoint ───────────────────────────────────────────────────────────
# AWS IoT Core domain config endpoint for the conexio-ingest domain configuration.
# Retrieve with:
#   aws iot describe-domain-configuration \
#     --domain-configuration-name conexio-ingest \
#     --query domainName --output text
# Example: xxxxxxxxxxxxxxx-ats.iot.us-east-1.amazonaws.com
CONFIG_CONEXIO_CLOUD_INGEST_ENDPOINT="endpoint.iot.us-east-1.amazonaws.com"
