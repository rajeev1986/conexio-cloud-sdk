# =============================================================================
# prj_ingest_key.conf — Ingest Key authentication overlay
#
# Developer quick-connect: authenticate via MQTT Custom Authorizer
# without fleet-provisioned TLS certificates.
#
# Usage:
#   west build -b conexio_stratus_pro/nrf9151/ns --pristine \
#              -- -DEXTRA_CONF_FILE=prj_ingest_key.conf
#
# Steps before building:
#   1. Register the device IMEI in Conexio Console → All Devices → + Add Device
#   2. Get an ingest key from Conexio Console → Organization → Ingest Keys
#   3. Replace the placeholder values below with your real IMEI and key
#
# ⚠ WARNING: Replace the placeholder values below before building.
#            Never commit a file containing a real ingest key to version control.
#            Add your per-developer copy (e.g. prj_ingest_key_dev.conf) to .gitignore.
#
# How it works:
#   The device connects on port 443 (ALPN "mqtt") instead of the standard
#   port 8883. The ingest key is sent as the MQTT username. AWS IoT Core
#   invokes a Custom Authorizer Lambda that validates the key, checks the
#   device IMEI is registered in your workspace, and returns a scoped
#   IoT policy. No client TLS certificate is needed.
# =============================================================================

# ── Device Identity ───────────────────────────────────────────────────────────
# Must be the 15-digit IMEI of your device (printed on the hardware label).
# The IMEI must be pre-registered in Conexio Console → All Devices.
CONFIG_CONEXIO_CLOUD_STATIC_DEVICE_ID_ENABLED=y
CONFIG_CONEXIO_CLOUD_STATIC_DEVICE_ID="device-imei"

# ── Ingest Key ────────────────────────────────────────────────────────────────
# Paste the full key from Conexio Console → Organization → Ingest Keys.
# Format: wks_<8chars>_<32chars>
CONFIG_CONEXIO_CLOUD_INGEST_KEY="ingest-key"
