# =============================================================================
# prj_ingest_key.conf — Ingest Key authentication overlay
#
# Developer quick-connect: authenticate via MQTT Custom Authorizer
# without fleet-provisioned TLS certificates.
#
# Usage:
#   west build -b conexio_stratus_pro/nrf9151/ns --pristine \
#              -- -DEXTRA_CONF_FILE=prj_ingest_key.conf
#
# Steps before building:
#   1. Register the device IMEI in Conexio Console → All Devices → + Add Device
#      (The IMEI is printed on the hardware label or read via: AT+CGSN)
#   2. Get an ingest key from Conexio Console → Organization → Ingest Keys
#   3. Replace the placeholder value below with your real key
#
# ⚠ WARNING: Replace the placeholder value before building.
#            Never commit a file containing a real ingest key to version control.
#            Add your per-developer copy (e.g. prj_ingest_key_dev.conf) to .gitignore.
#
# How it works:
#   The device IMEI is read automatically from the modem at boot — no manual
#   entry required. The device connects on port 8883 (standard MQTT TLS), sends
#   the ingest key + Custom Authorizer name as the MQTT username query param:
#     <ingest-key>?x-amz-customauthorizer-name=ConexioIngestKeyAuthorizerProd
#   AWS IoT Core triggers the Custom Authorizer Lambda which validates the key
#   and checks that the IMEI is registered in your workspace.
#   No ALPN, no client certificate, no port change required.
# =============================================================================

# ── Ingest Key ────────────────────────────────────────────────────────────────
# Paste the full key from Conexio Console → Organization → Ingest Keys.
# Format: wks_<8chars>_<32chars>
#
# The device IMEI is fetched automatically from the modem — no STATIC_DEVICE_ID needed.
CONFIG_CONEXIO_CLOUD_INGEST_KEY="ingest-key"
