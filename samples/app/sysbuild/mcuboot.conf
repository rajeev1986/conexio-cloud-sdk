# MCUboot configuration overlay for the Conexio Stratus Pro app.
# This file is merged into MCUboot's Kconfig by NCS sysbuild.
#
# Note: CONFIG_BOOT_SIGNATURE_KEY_FILE cannot be overridden here because
# NCS image_signing.cmake sets it from SB_CONFIG_BOOT_SIGNATURE_KEY_FILE
# (in sysbuild.conf) and ignores the Kconfig value. The key is configured
# in sysbuild.conf instead.
