# MCUboot configuration overlay for the Conexio Stratus Pro app.
# This file is automatically merged into MCUboot's Kconfig by NCS sysbuild.
#
# The absolute path ensures MCUboot finds the key regardless of how CMake
# resolves relative paths (MCUboot prefixes relative paths with its own
# source directory, not the application directory).
CONFIG_BOOT_SIGNATURE_KEY_FILE="/opt/nordic/ncs/v3.2.1/modules/lib/conexio-cloud-sdk/samples/app/keys/conexio-fota-signing.pem"
