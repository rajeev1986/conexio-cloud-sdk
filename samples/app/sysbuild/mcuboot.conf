# MCUboot configuration overlay for the Conexio Stratus Pro app.
# This file is automatically merged into MCUboot's Kconfig by NCS sysbuild.
#
# The signing key path here is relative to the APPLICATION_SOURCE_DIR
# (the samples/app directory), which NCS sysbuild resolves correctly
# — unlike sysbuild.conf where paths are relative to the west topdir
# and get double-prefixed by MCUboot's CMake.
CONFIG_BOOT_SIGNATURE_KEY_FILE="keys/conexio-fota-signing.pem"
