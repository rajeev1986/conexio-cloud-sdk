SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Project-specific FOTA signing key.
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE is the correct sysbuild variable — NCS
# passes it to west sign via image_signing.cmake. The path must be absolute
# because sysbuild resolves it from the west workspace root and MCUboot CMake
# does not double-prefix SB_CONFIG_ variables (unlike mcuboot.conf overrides).
# NEVER change this key after shipping devices without reflashing MCUboot.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/opt/nordic/ncs/v3.2.1/modules/lib/conexio-cloud-sdk/samples/app/keys/conexio-fota-signing.pem"
