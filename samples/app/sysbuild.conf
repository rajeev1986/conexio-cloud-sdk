SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Project-specific FOTA signing key.
# This key is committed to the repo so every build — USB flash or CI —
# produces images that MCUboot can verify. The private key signs the app
# image; MCUboot embeds the matching public key hash at build time.
# NEVER change this key after shipping devices without reflashing MCUboot.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="modules/lib/conexio-cloud-sdk/samples/app/keys/conexio-fota-signing.pem"
