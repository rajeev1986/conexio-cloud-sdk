SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Signing key for MCUboot image verification.
# MCUboot is built with this key's public component embedded.
# The app image (zephyr.signed.bin) is signed with the private key.
# Both must use the same key — otherwise FOTA signature check fails
# and MCUboot silently boots the primary slot instead of swapping.
# This key is the NCS default; replace with your own for production.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-ec-p256.pem"
