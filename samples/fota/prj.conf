# =============================================================================
# FOTA — Firmware Over-the-Air updates via Conexio Console
# =============================================================================
CONFIG_CONEXIO_CLOUD=y

# CBOR binary encoding
CONFIG_CONEXIO_CLOUD_CBOR=y
CONFIG_CONEXIO_CLOUD_CBOR_BUFFER_SIZE=256

# FOTA — enables FIRMWARE_UPDATE command + MCUboot integration
CONFIG_CONEXIO_CLOUD_FOTA=y
CONFIG_CONEXIO_CLOUD_FOTA_DOWNLOAD_TIMEOUT_SEC=300

# Flash — required by STREAM_FLASH which FOTA selects internally
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# NVS — required by fota.c for persisting pending job IDs across reboots
CONFIG_NVS=y

# Conexio firmware URLs carry large query strings (~1700 chars)
# Must be ≥ URL length or downloads will fail with HTTP 403
CONFIG_DOWNLOADER_STACK_SIZE=2048
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=2048

# Retry
CONFIG_CONEXIO_CLOUD_RETRY=y

# C library / system
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_POSIX_THREADS=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FAULT_DUMP=2
