# =============================================================================
# Sensor Data — Streaming sensor readings to Conexio Cloud
# =============================================================================
CONFIG_CONEXIO_CLOUD=y
CONFIG_CONEXIO_CLOUD_INTERVAL_SEC=120

# CBOR binary encoding
CONFIG_CONEXIO_CLOUD_CBOR=y
CONFIG_CONEXIO_CLOUD_CBOR_BUFFER_SIZE=512

# PSM — modem sleeps between publishes
CONFIG_CONEXIO_CLOUD_PSM=y
CONFIG_CONEXIO_CLOUD_PSM_TAU_SEC=3600
CONFIG_CONEXIO_CLOUD_PSM_ACTIVE_TIME_SEC=10

# Retry
CONFIG_CONEXIO_CLOUD_RETRY=y

# Simulated sensors on by default — replace with real driver reads
CONFIG_CONEXIO_SAMPLE_SIMULATED_SENSORS=y

# C library / system
CONFIG_POSIX_THREADS=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_RESET_ON_FATAL_ERROR=y

# TF-M minimal profile (required for bootloader partition layout)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Real SHT4x sensor (QWIIC port)
# CONFIG_SHT4X is auto-selected when the DT node is status="okay";
# explicit entries here document the intent.
CONFIG_SENSOR=n
CONFIG_I2C=n
CONFIG_SHT4X=n
