# =============================================================================
# Offline Buffer — Flash-backed telemetry buffering during connectivity loss
# =============================================================================
CONFIG_CONEXIO_CLOUD=y
CONFIG_CONEXIO_CLOUD_INTERVAL_SEC=30

# CBOR binary encoding
CONFIG_CONEXIO_CLOUD_CBOR=y
CONFIG_CONEXIO_CLOUD_CBOR_BUFFER_SIZE=512

# Offline buffer — stores telemetry in NVS flash when disconnected
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER=y
# 50 entries × 30s interval = ~25 min of offline coverage
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER_SIZE=50
# Replay 5 buffered entries per reconnect session
CONFIG_CONEXIO_CLOUD_OFFLINE_REPLAY_BATCH=5
# Discard entries older than 24 hours during replay
CONFIG_CONEXIO_CLOUD_OFFLINE_BUFFER_TTL_SEC=86400

# Retry
CONFIG_CONEXIO_CLOUD_RETRY=y

# Simulated sensors
CONFIG_CONEXIO_SAMPLE_SIMULATED_SENSORS=y

# C library / system
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_POSIX_THREADS=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CONEXIO_CLOUD_THREAD_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_RESET_ON_FATAL_ERROR=y
