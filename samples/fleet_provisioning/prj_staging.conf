# ── Staging environment overlay ──────────────────────────────────────────────
# Apply on top of prj.conf for staging builds:
#   west build -b conexio_stratus_pro/nrf9151/ns --pristine \
#              -- -DEXTRA_CONF_FILE=prj_staging.conf
#
# Connects to the same MQTT endpoint (mqtt.cloud.conexiotech.com) but uses
# the staging fleet provisioning template → devices get the -staging IoT policy
# and auto-register into iot-dashboard-devices-staging (not the prod table).
CONFIG_STRATUS_FLEET_TEMPLATE="ConexioFleetTemplate-staging"
